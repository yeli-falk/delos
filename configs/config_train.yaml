#output_dir: ./outputs

defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null

wandb:
  enable: true
  project: cjepa
  entity: heejeong_nam-brown-university


monitor_rankme: false                 
rankme_queue_length: 2048 

dataset_name: pusht_expert
cache_dir: "/cs/data/people/hnam16/.stable_worldmodel"

output_model_name: world_model
training_type: video # options: video, wm

trainer:
  max_epochs: 100
  strategy: ddp 
  devices: auto
  accelerator: gpu 
  precision: 16-mixed
  log_every_n_steps: 1

batch_size: 64
num_workers: 8
seed: 42

image_size: 224
patch_size: 16

n_steps:  ${eval:'${dinowm.num_preds} + ${dinowm.history_size}'}
frameskip: 5

dinowm:
  history_size: 3
  num_preds: 1
  proprio_dim: 4
  proprio_embed_dim: 10
  action_dim: 2
  action_embed_dim: 10

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

predictor_lr: 5e-4
proprio_encoder_lr: 5e-4
action_encoder_lr: 5e-4

dump_object: True
